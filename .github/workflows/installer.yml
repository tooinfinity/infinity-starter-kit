name: installer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Assets
        run: bun run build

      - name: Check Optional-Feature Documentation Matrix
        run: php artisan chisel:docs --check

      - name: Installer E2E Tests
        run: composer test:installer

  installer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, default, full]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Assets
        run: bun run build

      - name: Generated Application Smoke Tests (${{ matrix.profile }})
        run: composer test:smoke -- --filter="${{ matrix.profile }}"
