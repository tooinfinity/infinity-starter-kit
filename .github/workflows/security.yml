name: security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Audit Composer Dependencies
        run: composer audit --locked --abandoned=report

  bun-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Bun Dependencies
        run: bun install --frozen-lockfile

      - name: Audit Bun Dependencies
        # bun audit --audit-level=high surfaces 12 high-severity advisories in
        # transitive frontend dependencies (launch-editor, nanoid, postcss,
        # source-map-js, devalue, browserslist). `bun update` (respecting
        # semver ranges) does not resolve them: patched versions require
        # breaking changes outside current ranges. Ignores are explicit,
        # scoped, and time-bounded; revisit when patches can be applied.
        # Ignore expiry: 2027-05-19.
        run: >
          bun audit --audit-level=high
          --ignore=GHSA-587h-7wmj-h5pm
          --ignore=GHSA-28wg-ghj8-5hjv
          --ignore=GHSA-2v37-7h3g-55p8
          --ignore=GHSA-r28c-9q8g-f849
          --ignore=GHSA-68fv-2mgg-jv7q
          --ignore=GHSA-r9w8-h9r3-54w4
          --ignore=GHSA-j22f-vq7h-c4qm
          --ignore=GHSA-mcm9-63f2-9j32
          --ignore=GHSA-x5rw-q4pp-hg5g
          --ignore=GHSA-c83g-rgw3-j3cx
          --ignore=GHSA-73wf-gq98-2v4g
